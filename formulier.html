        <h2>Stuur mij een bericht</h2>

            Heb je een vraag of wil je meer informatie?
            Vul dan het onderstaande formulier in.
        </p>
        <form action="">
            <label for="naam">Naam:</label>
            <input type="text" id="naam" name="naam" required>

            <label for="email">E-mailadres:</label>
            <input type="email" id="email" name="email" required>

            <input type="text" id="onderwerp" name="onderwerp" required>

            <label for="berichten">Berichten</label>
            <textarea name="berichten" id="berichten" required></textarea>

            <button type="submit">Versturen</button>
